<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Selective Outlet. Последни бройки. Специални цени. Подбрани модели, налични за незабавна поръчка.">
<meta name="theme-color" content="#0d0e10">
<title>Selective Outlet</title>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Onest:wght@400;500;600&amp;family=Unbounded:wght@500;700&amp;display=swap">
<style>[hidden]{display:none!important}</style>
<style id="app-style">
/* Layout: one dark stage. Rotating shoe beside the headline, then stock grid, review screenshots, Instagram block. */
:root{
  --bg:#0d0e10; --surface:#151618; --surface-2:#1d1f22; --line:#2b2d31;
  --text:#ecebe7; --muted:#8f9297; --rock:#9a9b9d; --brass:#d9a441; --ok:#86b894; --bad:#d9776b;
  --f-display:'Unbounded',system-ui,sans-serif;
  --f-body:'Onest',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:400 16px/1.55 var(--f-body);padding-inline:16px;overflow-x:hidden}
body.admin{padding-bottom:96px}
a{color:inherit}
img{display:block;max-width:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.wrap{max-width:1160px;margin-inline:auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px;margin-inline:-16px;padding-inline:16px;background:rgba(13,14,16,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:12px;font:700 .8rem/1 var(--f-display);letter-spacing:.06em;text-decoration:none;white-space:nowrap}
.brand .logo{width:52px;height:52px;border-radius:50%;flex:none}
.brand .bt span{color:var(--rock);font-weight:500}
@media(max-width:480px){.brand .bt{display:none}}
.logo-lg{width:150px;height:150px;max-width:100%;border-radius:50%;margin:0 0 18px}
.top nav{display:flex;gap:20px;align-items:center;font:500 .72rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.top nav a{text-decoration:none;color:var(--muted)}
.top nav a:hover{color:var(--text)}
@media(max-width:560px){.top nav a.hide-s{display:none}}

.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:center;padding-block:40px 24px}
.hero-copy{min-width:0}
.eyebrow{font:500 .75rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:0 0 20px}
h1{font:700 clamp(2.1rem,5.4vw,4.1rem)/1.04 var(--f-display);letter-spacing:-.025em;margin:0 0 20px;text-wrap:balance}
.lede{font-size:1.1rem;color:#c9c9c6;max-width:30ch;margin:0 0 28px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.stage{position:relative;min-width:0;border-radius:4px;overflow:hidden;background:radial-gradient(ellipse 60% 55% at 50% 58%,#2a2c30 0%,#16171a 55%,var(--bg) 100%)}
.stage img{display:block;width:100%;height:auto;max-height:min(75vh,640px);object-fit:contain;margin-inline:auto}
.hint{position:absolute;left:14px;bottom:10px;margin:0;font:400 .68rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media(max-width:820px){.hero{grid-template-columns:minmax(0,1fr);padding-top:20px}.stage{order:-1}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--text);font:500 .74rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--rock)}
.btn.primary{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn.primary:hover{background:#fff}
.btn.small{min-height:40px;padding:8px 14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:#4a2b27}

section{padding-block:56px;scroll-margin-top:96px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
h2{font:700 clamp(1.4rem,3vw,2rem)/1.15 var(--f-display);letter-spacing:-.02em;margin:0}
.count{font:400 .78rem/1 var(--f-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.sizes .lab{align-self:center;font:400 .72rem var(--f-mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-right:6px}
.chip{position:relative;display:inline-block}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span,.chip button{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:3px;background:transparent;font:500 .82rem/1 var(--f-mono);color:var(--text);cursor:pointer}
.chip input:checked+span,.chip button[aria-pressed=true]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip input:focus-visible+span{outline:2px solid var(--text);outline-offset:3px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.card-img{position:relative;display:block;width:100%;padding:0;border:0;background:var(--surface-2);cursor:pointer;aspect-ratio:4/3}
.card-img img{width:100%;height:100%;object-fit:cover}
.off{position:absolute;top:10px;left:10px;padding:5px 8px;background:var(--brass);color:#14110a;font:500 .74rem/1 var(--f-mono);border-radius:2px}
.ex{position:absolute;top:10px;right:10px;padding:5px 8px;background:rgba(13,14,16,.85);border:1px solid var(--line);font:400 .66rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-radius:2px}
.soldtag{position:absolute;inset:auto 0 0 0;padding:8px;background:rgba(13,14,16,.88);text-align:center;font:500 .72rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card.sold .card-img img{filter:grayscale(1) brightness(.6)}
.card-body{display:flex;flex-direction:column;gap:10px;padding:16px;flex:1}
.card h3{margin:0;font:600 1rem/1.3 var(--f-body)}
.sz{margin:0;font:400 .8rem/1.5 var(--f-mono);color:var(--muted)}
.sz b{color:var(--text);font-weight:500}
.price{display:flex;align-items:baseline;gap:10px;margin:0;margin-top:auto;font-family:var(--f-mono)}
.price s{color:var(--muted);font-size:.85rem}
.price strong{font-size:1.2rem;font-weight:500;color:var(--brass)}
.card-actions{display:flex;flex-wrap:wrap;gap:8px}
.card-actions .btn{flex:1 1 auto}
.empty{padding:40px 20px;border:1px dashed var(--line);border-radius:4px;color:var(--muted);text-align:center}

.revs{columns:3 230px;column-gap:14px}
.rev{position:relative;break-inside:avoid;margin:0 0 14px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface)}
.rev button.view{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.rev img{width:100%;height:auto}
.rev .rm{position:absolute;top:8px;right:8px}
.rev.text{padding:18px}
.rev.text .rm{position:static;margin-top:12px}
.stars{margin:0;color:var(--brass);letter-spacing:.12em;font-size:1.05rem}
.rtext{margin:10px 0 12px;color:#d6d6d2}
.rev figcaption{font:500 .74rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.contact{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;padding:36px;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.mark{margin:0 0 14px;font:700 .8rem/1 var(--f-display);letter-spacing:.14em}
.contact-copy p{margin:0 0 12px}
.contact-copy .big{font:700 clamp(1.3rem,2.6vw,1.8rem)/1.2 var(--f-display);letter-spacing:-.02em}
.contact-copy .soft{color:var(--muted)}
.ig-card{display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-width:0;padding:22px;border:1px solid var(--line);border-radius:4px;background:var(--bg);text-decoration:none}
.ig-card:hover{border-color:var(--rock)}
.ig-card .k{font:400 .72rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ig-card .h{font:700 clamp(1.1rem,2.4vw,1.5rem)/1.2 var(--f-display);letter-spacing:-.02em;overflow-wrap:anywhere}
.ig-card .f{font-size:.92rem;color:#c9c9c6}
@media(max-width:820px){.contact{grid-template-columns:minmax(0,1fr);padding:22px}}

footer{padding-block:28px 40px;border-top:1px solid var(--line);color:var(--muted);font:400 .74rem/1.6 var(--f-mono);letter-spacing:.06em;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));background:rgba(5,5,6,.82);overflow-y:auto}
.sheet{position:relative;width:100%;max-width:880px;margin-block:auto;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.sheet.narrow{max-width:520px}
.x{position:absolute;top:10px;right:10px;width:44px;height:44px;border:0;background:none;font-size:1.6rem;line-height:1;color:var(--muted);cursor:pointer}
.sheet-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media(max-width:720px){.sheet-grid{grid-template-columns:minmax(0,1fr)}}
.gal img.main{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;background:var(--surface-2)}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumbs button{width:64px;padding:0;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:none;cursor:pointer}
.thumbs button[aria-pressed=true]{border-color:var(--text)}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover}
form h3{margin:0 40px 6px 0;font:700 1.2rem/1.25 var(--f-display);letter-spacing:-.02em}
fieldset{border:0;padding:0;margin:16px 0}
legend{padding:0;margin-bottom:8px;font:400 .72rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
label.lbl{display:block;margin:12px 0 6px;font:400 .72rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--line);border-radius:3px;font-size:1rem}
input[type=text]:focus,input[type=tel]:focus,input[type=number]:focus,textarea:focus{border-color:var(--rock);outline:none}
.err{min-height:1.4em;margin:10px 0 0;color:var(--bad);font-size:.9rem}
.after{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.after .ok{color:var(--ok);margin:0 0 10px}
.after textarea{font:400 .82rem/1.5 var(--f-mono);margin-bottom:12px}
.note{margin:14px 0 0;font-size:.82rem;color:var(--muted)}
.lightbox img{max-width:min(92vw,900px);max-height:88vh;margin:auto;border-radius:3px}

.adminbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#17181b;border-top:1px solid var(--rock)}
.adminbar .tag{font:500 .7rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.adminbar .meter{margin-left:auto;font:400 .72rem/1.3 var(--f-mono);color:var(--muted)}
.adminbar .msg{flex-basis:100%;margin:0;font-size:.85rem;color:var(--muted);min-height:1.2em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

var IG='selectiveimp';
var app=document.getElementById('app');
var saved={};
try{saved=JSON.parse(document.getElementById('state').textContent)||{};}catch(e){saved={};}
var data={currency:saved.currency||'€',reviews:Array.isArray(saved.reviews)?saved.reviews:[],hero:typeof saved.hero==='string'?saved.hero:''};
var products=Array.isArray(saved.products)?saved.products:makeSamples();
var isAdmin=false,art=null,dirty=false,sizeFilter='',pendingDelete='';
var FALLBACK_RESET=':root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';

function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function money(n){n=Number(n)||0;return (Math.abs(n-Math.round(n))>0.004?n.toFixed(2):String(Math.round(n)))+' '+data.currency;}

function sampleImg(a,b){
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs><rect width="400" height="300" fill="url(#g)"/><path d="M70 205 C70 170 100 120 140 118 C165 118 172 140 195 146 C230 156 270 160 318 192 C335 204 336 218 318 222 L88 222 C74 222 70 216 70 205 Z" fill="#0b0c0d" opacity=".85"/><rect x="74" y="222" width="250" height="16" rx="8" fill="#d0d1d2" opacity=".8"/></svg>';
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
function makeSamples(){
  return [
    {id:uid(),name:'Примерна обувка 1',sizes:['41','42','43'],oldPrice:150,price:99,images:[sampleImg('#3a3d42','#1b1c1f')],sold:false,example:true},
    {id:uid(),name:'Примерна обувка 2',sizes:['40','42','44','45'],oldPrice:130,price:85,images:[sampleImg('#4a4743','#201f1d')],sold:false,example:true},
    {id:uid(),name:'Примерна обувка 3',sizes:['43','44'],oldPrice:170,price:109,images:[sampleImg('#34393f','#16181a')],sold:false,example:true},
    {id:uid(),name:'Примерна обувка 4',sizes:['38','39','41'],oldPrice:120,price:79,images:[sampleImg('#403d3a','#1a1918')],sold:true,example:true}
  ];
}

/* ---------- shell ---------- */
function shell(){
  return ''
  +'<div class="wrap">'
  +'<header class="top"><a class="brand" href="#top" aria-label="Selective Outlet"><img class="logo" alt="" src="'+LOGO+'"><span class="bt">SELECTIVE <span>OUTLET</span></span></a>'
  +'<nav><a href="#outlet">Outlet</a><a href="#reviews" id="nav-reviews" class="hide-s">Отзиви</a><a href="#contact">Контакт</a></nav></header>'
  +'<main id="top">'
  +'<div class="hero"><div class="hero-copy">'
  +'<p class="eyebrow">Последни бройки</p><h1>Специални цени.</h1>'

  +'<div class="stage" id="stage"></div></div>'

  +'<section id="contact"><div class="contact"><div class="contact-copy">'
  +'<img class="logo-lg" alt="Selective Outlet" src="'+LOGO+'">'

/* ---------- models ---------- */
function allSizes(){
  var m={};
  products.forEach(function(p){if(!p.sold)(p.sizes||[]).forEach(function(s){m[s]=1;});});
  return Object.keys(m).sort(function(a,b){return parseFloat(a)-parseFloat(b);});
}
function card(p){
  var off=p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;
  var id=esc(p.id);
  var admin='';
  if(isAdmin){
    admin='<div class="card-actions"><button class="btn small" data-act="toggle-sold" data-id="'+id+'">'+(p.sold?'Върни като налична':'Продадена')+'</button>'
    +'<button class="btn small danger" data-act="delete" data-id="'+id+'">'+(pendingDelete===p.id?'Потвърди изтриване':'Изтрий')+'</button></div>';
  }
  return '<article class="card'+(p.sold?' sold':'')+'">'
  +'<button class="card-img" data-act="open" data-id="'+id+'" aria-label="Отвори '+esc(p.name)+'"><img alt="'+esc(p.name)+'" loading="lazy" src="'+esc(p.images[0]||'')+'">'
  +(off?'<span class="off">−'+off+'%</span>':'')+(p.example?'<span class="ex">Пример</span>':'')+(p.sold?'<span class="soldtag">Продадена</span>':'')+'</button>'
  +'<div class="card-body"><h3>'+esc(p.name)+'</h3>'

function compress(file,max,q){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var s=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q));
      };
      im.onerror=function(){rej(new Error('img'));};
      im.src=fr.result;
    };
    fr.onerror=function(){rej(new Error('read'));};
    fr.readAsDataURL(file);
  });
}
function bytes(){
  var n=120000;
  products.forEach(function(p){p.images.forEach(function(s){n+=s.length;});});
  data.reviews.forEach(function(s){n+=typeof s==='string'?s.length:400;});

  return n;
}

function addReviews(files){

  setMsg('Обработвам снимките…');

    imgs.forEach(function(s){data.reviews.push(s);});
    touch();setMsg(imgs.length+' отзива добавени. Натисни „Публикувай“.');
  }).catch(function(){setMsg('Една от снимките не може да се прочете. Опитай с JPG или PNG.');});
}
function buildDoc(){
  var payload={currency:data.currency,products:products,reviews:data.reviews,hero:data.hero,savedAt:new Date().toISOString()};
  var json=JSON.stringify(payload).replace(/</g,'\\u003c');
  var st=document.head.querySelector('style');
  var reset=st&&/color-scheme/.test(st.textContent)?st.textContent:FALLBACK_RESET;
  var end='</'+'script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
  +''+$('#app-fonts').outerHTML+'<style id="app-style">'+$('#app-style').textContent+'</style><div id="app"></div>'
  +'<script type="application/json" id="state">'+json+end
  +'<script id="app-script">'+$('#app-script').textContent+end+'</body></html>';
}
function save(){
  if(!art||!dirty)return;
  if(bytes()>15.2*1048576){setMsg('Страницата е почти пълна. Изтрий стари обувки или отзиви.');return;}
  setMsg('Публикувам…');
  art.publish(buildDoc()).then(function(){setMsg('Публикувано. Страницата се презарежда.');}).catch(function(e){
    var c=e&&e.code;
    if(c==='conflict')setMsg('Страницата е била променена междувременно и се презарежда. Повтори промените.');
    else if(c==='too_large')setMsg('Страницата е твърде голяма. Изтрий стари обувки или отзиви.');
    else if(c==='rate_limited')setMsg('Твърде много публикации подред. Изчакай малко.');
    else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='capability_disabled'){isAdmin=false;renderAdmin();renderModels();renderReviews();}
    else setMsg('Публикуването не успя. Опитай пак след малко.');
  });
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='overlay'){if(e.target===el)closeModal();return;}
  var id=el.getAttribute('data-id');
  if(act==='close')closeModal();
  else if(act==='open')openProduct(id);
  else if(act==='size'){sizeFilter=el.getAttribute('data-size')||'';renderModels();}
  else if(act==='thumb'){
    var i=+el.getAttribute('data-i'),p=products.filter(function(x){return x.id===$('#orderform').getAttribute('data-id');})[0];
    if(p){$('#mainimg').src=p.images[i];Array.prototype.forEach.call(document.querySelectorAll('.thumbs button'),function(b){b.setAttribute('aria-pressed',b===el?'true':'false');});}
  }
  else if(act==='lightbox'){
    $('#modal-root').innerHTML='<div class="overlay lightbox" data-act="overlay"><button class="x" data-act="close" aria-label="Затвори" style="color:#fff">×</button><img alt="Отзив от Instagram" src="'+esc(data.reviews[+el.getAttribute('data-i')])+'"></div>';
  }
  else if(act==='toggle-sold'){products.forEach(function(p){if(p.id===id)p.sold=!p.sold;});touch();}
  else if(act==='delete'){
    if(pendingDelete===id){products=products.filter(function(p){return p.id!==id;});pendingDelete='';touch();}
    else{pendingDelete=id;renderModels();}
  }
  else if(act==='rm-review'){data.reviews.splice(+el.getAttribute('data-i'),1);touch();}
  else if(act==='rm-examples'){products=products.filter(function(p){return !p.example;});touch();}
  else if(act==='addshoe')openAdd();
  else if(act==='review-form')openReview();
  else if(act==='add-text-review')openAddText();
  else if(act==='rm-hero'){data.hero='';touch();renderHero();}
  else if(act==='save')save();
  else if(act==='owner'){if(isAdmin)ownerNote('Вече си в режим на управление. Лентата е най-долу.');else detect(true);}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='orderform')submitOrder(e.target);
  else if(e.target.id==='addform')submitAdd();
  else if(e.target.id==='reviewform')submitReview(e.target);
  else if(e.target.id==='textform')submitText(e.target);
});
document.addEventListener('change',function(e){
  if(e.target.id==='revfile'){addReviews(e.target.files);e.target.value='';}
  else if(e.target.id==='herofile'){addHero(e.target.files&&e.target.files[0]);e.target.value='';}
});

function ownerNote(t){var n=document.getElementById('ownernote');if(n)n.textContent=t||'';}
function detect(verbose){
  if(!(window.claude&&window.claude.use)){if(verbose)ownerNote('Тази страница е отворена без функции за управление. Отвори я от claude.ai.');return;}
  Promise.all([window.claude.use('user'),window.claude.use('artifact')]).then(function(r){
    var u=r[0];art=r[1];
    var ok=false;
    try{ok=!!(u&&((u.isOwner&&u.isOwner())||(u.canEdit&&u.canEdit())));}catch(e){ok=false;}
